# ============================================================
# WinPrintServer 配置文件
# 修改后重启服务生效
# ============================================================

[server]
# 监听地址，0.0.0.0 表示监听所有网卡
host = 0.0.0.0

# RAW 打印协议端口（标准 TCP/IP，最常用）
raw_port = 9100

# LPD/LPR 协议端口（Unix / Windows LPR 客户端）
lpd_port = 515

# Web 状态页端口
web_port = 8080

# 是否启用各服务
enable_raw = true
enable_lpd = false
enable_web = true

# 最大并发连接数
max_connections = 50

# 单个任务接收超时（秒）
job_timeout = 300

[printer]
# 目标打印机名称（必须与「设备和打印机」中的名称一致）
# 留空则自动使用系统默认打印机
# 示例: default_printer = LQ-630K
default_printer =

# 多端口映射（可选）: 端口=打印机名,端口=打印机名
# 例如: 9100=LQ-630K,9101=HP LaserJet
port_map =

# 打印失败重试
retry_count = 3
retry_delay = 0.5

[logging]
# 日志级别: DEBUG / INFO / WARNING / ERROR
level = INFO

# 日志文件路径（相对程序目录）
file = logs/print_server.log

# 日志轮转
max_bytes = 5242880
backup_count = 5

# 是否输出到控制台
console = true

[security]
# 允许访问的客户端 IP，逗号分隔
# * = 允许所有
# 示例: 192.168.1.10,192.168.1.*,192.168.1.0/24
allowed_ips = *

# 预留：是否要求认证
require_auth = false
